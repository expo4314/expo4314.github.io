<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>Nano · 个人主页</title>
  <meta name="description" content="Nano 的个人主页，记录正在做的事、喜欢的技术与生活碎片。" />
  <link rel="icon" href="https://avatars.githubusercontent.com/u/265448273?v=4" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<body>
  <div id="particles-js"></div>
  <main class="page">

      <h1>你好，我是 <span class="accent">Nano</span></h1>

        欢迎来到我的个人主页。这里会展示我正在做的事情、喜欢的技术，以及对世界的观察。
      </p>
      <div class="actions">
        <a class="btn primary" href="https://github.com/expo4314" target="_blank" rel="noopener">GitHub</a>
        <a class="btn secondary" href="mailto:hi@example.com">联系我</a>
      </div>

    <section class="content">
      <h2>关于我</h2>
      <p>
        我是一名开发者，关注工具、效率与创造力。工作之外，我喜欢研究怎么把复杂的事情做得更简单。

        <li>学习现代 Web 与 AI 应用开发</li>
        <li>记录生活里值得记住的片段</li>
      </ul>

      <h2>技能</h2>
      <div class="skills">
        <span>Web 开发</span>
        <span>Python</span>
        <span>JavaScript</span>
        <span>UI 设计</span>
        <span>自动化</span>
        <span>AI Prompting</span>
      </div>

      <h2>一些链接</h2>
      <ul class="links">
        <li><a href="https://github.com/expo4314" target="_blank" rel="noopener">GitHub 主页</a></li>
      </ul>
    </section>

    <footer class="footer">
      <span id="clock"></span>
      <span>· 使用 HTML / CSS / JS 构建</span>
    </footer>
  </main>

  <script src="script.js"></script>

</html>
